<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
  <title id="title">bio3dpc — Return to Rapture</title>
  <desc id="desc">An Art Deco brass frame and a porthole overlooking an underwater skyline. BioShock 3D, the BREW mobile game, preserved for Linux.</desc>
