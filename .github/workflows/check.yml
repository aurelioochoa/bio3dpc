name: Source and publishing checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up the project environment
        run: make venv
      - name: Check for game files and credentials
        run: .venv/bin/python tools/check_publish.py
      - name: Check README media
        run: .venv/bin/python tools/check_publish.py --media
      - name: Run tests without original game files
        run: .venv/bin/python -m pytest -q
